<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf9f6; color: #292824; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif; line-height: 1.85; overflow-wrap: anywhere; }
    .page { max-width: 840px; margin: 0 auto; padding: 32px 24px 48px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 24px; border-bottom: 1px solid #dedbd4; }
    .brand { color: #292824; font-size: 18px; font-weight: 650; letter-spacing: .08em; text-decoration: none; }
    nav { display: flex; gap: 18px; font-size: 14px; }
    a { color: #805b24; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid #805b24; outline-offset: 4px; }
    nav a[aria-current="page"] { color: #292824; font-weight: 650; }
    main { padding-top: 20px; }
    h1 { font-size: clamp(1.55rem, 4vw, 2rem); line-height: 1.45; margin: 12px 0 16px; }
    h2 { font-size: 1.2rem; line-height: 1.55; margin: 36px 0 12px; }
    p, ul { margin: 14px 0; }
    ul { padding-left: 1.4em; }
    li + li { margin-top: 10px; }
    footer { border-top: 1px solid #dedbd4; margin-top: 40px; padding-top: 20px; color: #68645b; font-size: 14px; }
    @media (max-width: 480px) { .page { padding: 24px 20px 36px; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="{{ '/' | relative_url }}">Mouth Synth</a>
      <nav aria-label="{% if page.lang == 'en' %}Language{% else %}言語{% endif %}">
        <a href="{{ '/' | relative_url }}" lang="ja" hreflang="ja"{% if page.lang == 'ja' %} aria-current="page"{% endif %}>日本語</a>
        <a href="{{ '/en/' | relative_url }}" lang="en" hreflang="en"{% if page.lang == 'en' %} aria-current="page"{% endif %}>English</a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer>ToppyMotion · Mouth Synth</footer>
  </div>
</body>
</html>
